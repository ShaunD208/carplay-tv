name: Build CarPlay TV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build master playlist
        run: python build_playlist.py

      - name: Normalize CarPlay categories
        run: python normalize_categories.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add master.m3u playlist_report.txt browser_test_candidates.m3u channel_sources.json

          if git diff --cached --quiet; then
            echo "No playlist changes detected."
            exit 0
          fi

          git commit -m "Update CarPlay TV master playlist"
          git push
