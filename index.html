<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CarPlay TV</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d10;
      color: white;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #11151a;
      padding: 14px;
      border-bottom: 1px solid #292f36;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    #status {
      font-size: 13px;
      color: #aeb7c2;
      margin-bottom: 10px;
    }

    #search {
      width: 100%;
      padding: 13px 15px;
      border-radius: 10px;
      border: 1px solid #343b44;
      background: #1a1f25;
      color: white;
      font-size: 16px;
    }

    .player-wrap {
      background: black;
      width: 100%;
    }

    video {
      width: 100%;
      max-height: 45vh;
      display: block;
      background: black;
    }

    #nowPlaying {
      padding: 10px 14px;
      background: #11151a;
      font-weight: 600;
      min-height: 42px;
    }

    #categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px;
      background: #0b0d10;
      position: sticky;
      top: 115px;
      z-index: 9;
    }

    .category {
      flex: 0 0 auto;
      border: 1px solid #343b44;
      background: #171b20;
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }

    .category.active {
      background: white;
      color: black;
    }

    #channels {
      padding: 8px 12px 30px;
    }

    .channel {
      display: flex;
      align-items: center;
      min-height: 72px;
      gap: 13px;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: #171b20;
      border: 1px solid #262c33;
      cursor: pointer;
    }

    .channel:active {
      transform: scale(0.99);
    }

    .channel img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      background: white;
      border-radius: 9px;
      padding: 4px;
    }

    .channel-info {
      min-width: 0;
    }

    .channel-name {
      font-size: 17px;
      font-weight: 600;
    }

    .channel-group {
      color: #9ba5b1;
      font-size: 13px;
      margin-top: 4px;
    }

    .error {
      padding: 20px;
      color: #ffb4b4;
    }
  </style>
</head>

<body>

<header>
  <h1>CarPlay TV</h1>
  <div id="status">Loading Samsung TV Plus US…</div>
  <input id="search" type="search" placeholder="Search channels…" />
</header>

<div class="player-wrap">
  <video id="video" controls playsinline></video>
</div>

<div id="nowPlaying">Select a channel</div>

<div id="categories"></div>

<div id="channels"></div>

<script>
const PLAYLIST =
  "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/samsungtvplus_us.m3u";

let allChannels = [];
let selectedGroup = "All";
let hls = null;

const video = document.getElementById("video");
const channelsEl = document.getElementById("channels");
const categoriesEl = document.getElementById("categories");
const searchEl = document.getElementById("search");
const statusEl = document.getElementById("status");
const nowPlayingEl = document.getElementById("nowPlaying");

function parseM3U(text) {
  const lines = text.split(/\r?\n/);
  const channels = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();

    if (!line.startsWith("#EXTINF")) continue;

    const name = line.substring(line.lastIndexOf(",") + 1).trim();

    const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
    const groupMatch = line.match(/group-title="([^"]*)"/i);

    let stream = "";

    for (let j = i + 1; j < lines.length; j++) {
      const candidate = lines[j].trim();

      if (!candidate) continue;

      if (!candidate.startsWith("#")) {
        stream = candidate;
        break;
      }
    }

    if (name && stream) {
      channels.push({
        name,
        logo: logoMatch ? logoMatch[1] : "",
        group: groupMatch ? groupMatch[1] : "Other",
        stream
      });
    }
  }

  return channels;
}

function renderCategories() {
  const groups = [
    "All",
    ...Array.from(new Set(allChannels.map(c => c.group))).sort()
  ];

  categoriesEl.innerHTML = "";

  groups.forEach(group => {
    const button = document.createElement("button");

    button.className =
      "category" + (group === selectedGroup ? " active" : "");

    button.textContent = group;

    button.onclick = () => {
      selectedGroup = group;
      renderCategories();
      renderChannels();
    };

    categoriesEl.appendChild(button);
  });
}

function renderChannels() {
  const query = searchEl.value.toLowerCase().trim();

  const filtered = allChannels.filter(channel => {
    const matchesGroup =
      selectedGroup === "All" || channel.group === selectedGroup;

    const matchesSearch =
      !query ||
      channel.name.toLowerCase().includes(query) ||
      channel.group.toLowerCase().includes(query);

    return matchesGroup && matchesSearch;
  });

  channelsEl.innerHTML = "";

  filtered.forEach(channel => {
    const item = document.createElement("div");
    item.className = "channel";

    const logo = document.createElement("img");

    if (channel.logo) {
      logo.src = channel.logo;
    }

    logo.alt = "";

    const info = document.createElement("div");
    info.className = "channel-info";

    const name = document.createElement("div");
    name.className = "channel-name";
    name.textContent = channel.name;

    const group = document.createElement("div");
    group.className = "channel-group";
    group.textContent = channel.group;

    info.appendChild(name);
    info.appendChild(group);

    item.appendChild(logo);
    item.appendChild(info);

    item.onclick = () => playChannel(channel);

    channelsEl.appendChild(item);
  });

  statusEl.textContent =
    `${filtered.length} of ${allChannels.length} channels`;
}

function playChannel(channel) {
  nowPlayingEl.textContent = `Now Playing: ${channel.name}`;

  if (hls) {
    hls.destroy();
    hls = null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = channel.stream;
    video.play().catch(() => {});
    return;
  }

  if (window.Hls && Hls.isSupported()) {
    hls = new Hls();

    hls.loadSource(channel.stream);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        nowPlayingEl.textContent =
          `${channel.name} — stream could not be played`;
      }
    });

    return;
  }

  nowPlayingEl.textContent =
    `${channel.name} — HLS playback isn't supported by this browser`;
}

searchEl.addEventListener("input", renderChannels);

async function loadPlaylist() {
  try {
    const response = await fetch(PLAYLIST, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const text = await response.text();

    allChannels = parseM3U(text);

    if (!allChannels.length) {
      throw new Error("No channels found");
    }

    renderCategories();
    renderChannels();

  } catch (error) {
    console.error(error);

    statusEl.textContent = "Playlist failed to load";

    channelsEl.innerHTML =
      `<div class="error">
        Samsung TV Plus could not be loaded.<br><br>
        ${error.message}
      </div>`;
  }
}

loadPlaylist();
</script>

</body>
</html>
