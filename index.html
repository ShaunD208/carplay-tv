<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CarPlay TV</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0d10;color:#fff}header{position:sticky;top:0;z-index:20;background:#11151a;padding:12px;border-bottom:1px solid #292f36}h1{margin:0 0 5px;font-size:21px}.sub,#status,#nowMeta{color:#aeb7c2;font-size:13px}#search{width:100%;margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid #343b44;background:#1a1f25;color:#fff;font-size:16px}.player{background:#000}video{display:block;width:100%;max-height:45vh;background:#000}#now{background:#11151a;padding:10px 14px}#nowName{font-size:16px;font-weight:700}#program{margin-top:8px;font-size:16px;font-weight:700}#programTime,#nextProgram{margin-top:3px;color:#aeb7c2;font-size:13px}.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid #20262c}.chip,.alt{flex:0 0 auto;padding:8px 12px;border:1px solid #3a424b;border-radius:999px;background:#171b20;color:#fff;font-size:13px}.chip.active,.alt.active{background:#fff;color:#000}#alternates{padding:10px 12px;background:#11151a;display:none}.alt-title{font-size:12px;color:#aeb7c2;margin-bottom:7px}.alt-row{display:flex;gap:7px;overflow-x:auto}#message{display:none;margin:10px 12px;padding:10px;border-radius:8px;background:#2b2020;color:#ffd0d0;font-size:13px}#channels{padding:8px 12px 30px}.channel{display:flex;align-items:center;gap:10px;min-height:78px;padding:9px;margin-bottom:8px;border:1px solid #262c33;border-radius:12px;background:#171b20}.channel img{width:58px;height:58px;object-fit:contain;padding:4px;border-radius:9px;background:#fff}.info{min-width:0;flex:1}.name{font-size:16px;font-weight:650}.meta{margin-top:4px;color:#9ba5b1;font-size:13px}.show{margin-top:4px;color:#d7dde4;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-block;margin-top:5px;padding:3px 7px;border:1px solid #3a424b;border-radius:6px;font-size:11px;font-weight:700}.fallback{margin-left:6px;color:#9ba5b1;font-size:11px}.fav{flex:0 0 auto;width:42px;height:42px;border:0;background:transparent;color:#78828d;font-size:27px;line-height:1;border-radius:50%}.fav.on{color:#ffd85a}.empty{padding:25px;text-align:center;color:#9ba5b1}
</style></head><body><header><h1>CarPlay TV</h1><div class="sub">Samsung + Pluto + Roku + Tubi + Plex</div><div id="status">Loading…</div><input id="search" type="search" placeholder="Search channels or programs…"></header><div class="player"><video id="video" controls playsinline></video></div><div id="now"><div id="nowName">Select a channel</div><div id="nowMeta">Provider and category will appear here</div><div id="program"></div><div id="programTime"></div><div id="nextProgram"></div></div><div id="alternates"><div class="alt-title">Available feeds — switch provider if the primary has a playback problem</div><div id="altRow" class="alt-row"></div></div><div id="message"></div><div id="categories" class="chips"></div><div id="channels"></div><script>
const M3U='master.m3u',DB='channel_sources.json',EPG='epg.json',FAVKEY='carplay-tv-favorites-v1';let channels=[],db=[],epg={channels:{}},category='★ Favorites',hls=null,current=null,favorites=new Set(JSON.parse(localStorage.getItem(FAVKEY)||'[]'));const $=id=>document.getElementById(id),video=$('video');function attr(t,a){const m=t.match(new RegExp(a+'="([^"]*)"','i'));return m?m[1].trim():''}function parseM3U(t){const l=t.split(/\r?\n/),out=[];for(let i=0;i<l.length;i++){const x=l[i].trim();if(!x.startsWith('#EXTINF'))continue;const name=x.substring(x.lastIndexOf(',')+1).trim(),logo=attr(x,'tvg-logo'),group=attr(x,'group-title')||'Other',source=attr(x,'source')||'Unknown';let stream='';for(let j=i+1;j<l.length;j++){const c=l[j].trim();if(!c)continue;if(c.startsWith('#EXTINF'))break;if(!c.startsWith('#')){stream=c;break}}if(name&&stream)out.push({name,logo,group,source,stream})}return out}function guide(name){const c=epg.channels&&epg.channels[name];if(!c||!c.programmes)return{now:null,next:null};const ts=Math.floor(Date.now()/1000),p=c.programmes;let now=null,next=null;for(const x of p){if(x.s<=ts&&x.e>ts)now=x;else if(x.s>ts){next=x;break}}return{now,next}}function timeRange(p){if(!p)return'';const o={hour:'numeric',minute:'2-digit'};return`${new Date(p.s*1000).toLocaleTimeString([],o)} – ${new Date(p.e*1000).toLocaleTimeString([],o)}`}function msg(t){$('message').textContent=t||'';$('message').style.display=t?'block':'none'}function saveFavs(){localStorage.setItem(FAVKEY,JSON.stringify([...favorites]))}function toggleFav(name){favorites.has(name)?favorites.delete(name):favorites.add(name);saveFavs();renderCats();render()}function renderCats(){const preferred=['★ Favorites','All','News','Local News','Sports','Movies','TV','Comedy','Crime','Reality','Classics','Sci-Fi & Horror','Kids','Music','Food & Home','Lifestyle','Nature & Travel','History & Science','Documentary','Anime','Game Shows','Westerns','Other'];$('categories').innerHTML='';preferred.filter(c=>c==='All'||c==='★ Favorites'||channels.some(x=>x.group===c)).forEach(c=>{const b=document.createElement('button');b.className='chip'+(c===category?' active':'');b.textContent=c+(c==='★ Favorites'&&favorites.size?` (${favorites.size})`:'');b.onclick=()=>{category=c;renderCats();render()};$('categories').appendChild(b)})}function dbEntry(name){return db.find(x=>x.name===name)}function render(){const q=$('search').value.toLowerCase().trim();const f=channels.filter(x=>{const g=guide(x.name),pt=[g.now&&g.now.t,g.next&&g.next.t].filter(Boolean).join(' ').toLowerCase(),cat=category==='All'||(category==='★ Favorites'?favorites.has(x.name):x.group===category);return cat&&(!q||x.name.toLowerCase().includes(q)||x.group.toLowerCase().includes(q)||x.source.toLowerCase().includes(q)||pt.includes(q))});$('channels').innerHTML='';if(!f.length&&category==='★ Favorites')$('channels').innerHTML='<div class="empty">Tap the ☆ beside any channel to add it to Favorites.</div>';f.forEach(x=>{const d=dbEntry(x.name),fc=d&&d.fallbacks?d.fallbacks.length:0,g=guide(x.name),item=document.createElement('div');item.className='channel';const im=document.createElement('img');if(x.logo)im.src=x.logo;im.alt='';const info=document.createElement('div');info.className='info';const n=document.createElement('div');n.className='name';n.textContent=x.name;const m=document.createElement('div');m.className='meta';m.textContent=x.group;info.append(n,m);if(g.now){const s=document.createElement('div');s.className='show';s.textContent=`Now: ${g.now.t}`;info.append(s)}const b=document.createElement('span');b.className='badge';b.textContent=x.source;info.append(b);if(fc){const s=document.createElement('span');s.className='fallback';s.textContent=`+${fc} alternate${fc===1?'':'s'}`;info.append(s)}const fav=document.createElement('button');fav.className='fav'+(favorites.has(x.name)?' on':'');fav.textContent=favorites.has(x.name)?'★':'☆';fav.title='Favorite';fav.onclick=e=>{e.stopPropagation();toggleFav(x.name)};item.append(im,info,fav);item.onclick=()=>selectChannel(x);$('channels').appendChild(item)});$('status').textContent=`${f.length} of ${channels.length} channels${favorites.size?` • ${favorites.size} favorites`:''}`}function captionsOff(){try{for(let i=0;i<video.textTracks.length;i++)video.textTracks[i].mode='disabled'}catch(e){}if(hls)try{hls.subtitleTrack=-1}catch(e){}}function updateNow(){if(!current)return;const g=guide(current.name);$('program').textContent=g.now?g.now.t:'Program information unavailable';$('programTime').textContent=g.now?timeRange(g.now):'';$('nextProgram').textContent=g.next?`Up Next: ${g.next.t} • ${timeRange(g.next)}`:''}function reset(){msg('');if(hls){hls.destroy();hls=null}video.pause();video.removeAttribute('src');video.load()}function play(feed,name,group){reset();$('nowName').textContent=name;$('nowMeta').textContent=`${feed.source} • ${group}`;updateNow();if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=feed.url||feed.stream;video.addEventListener('loadedmetadata',captionsOff,{once:true});video.addEventListener('loadeddata',captionsOff,{once:true});video.play().catch(()=>msg('Playback did not start automatically. Press Play or choose another feed.'));return}if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true});hls.loadSource(feed.url||feed.stream);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{hls.subtitleTrack=-1;captionsOff();video.play().catch(()=>msg('Press Play to begin.'))});hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED,()=>{hls.subtitleTrack=-1;captionsOff()});hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)msg('This feed could not be played. Try an alternate provider.')});return}msg('This browser does not support HLS playback.')}function selectChannel(x){current=x;const d=dbEntry(x.name),feeds=[{source:x.source,url:x.stream,primary:true}];if(d&&d.fallbacks)(d.fallbacks||[]).forEach(f=>feeds.push({source:f.source,url:f.url,primary:false}));$('altRow').innerHTML='';$('alternates').style.display=feeds.length>1?'block':'none';feeds.forEach((f,i)=>{const b=document.createElement('button');b.className='alt'+(i===0?' active':'');b.textContent=f.source+(i===0?' • Primary':'');b.onclick=()=>{[...$('altRow').children].forEach(z=>z.classList.remove('active'));b.classList.add('active');play(f,x.name,x.group)};$('altRow').appendChild(b)});play(feeds[0],x.name,x.group)}$('search').addEventListener('input',render);setInterval(()=>{updateNow();render()},60000);(async()=>{try{const[mr,dr,er]=await Promise.all([fetch(M3U,{cache:'no-store'}),fetch(DB,{cache:'no-store'}),fetch(EPG,{cache:'no-store'})]);if(!mr.ok||!dr.ok)throw new Error('Playlist data unavailable');channels=parseM3U(await mr.text());db=await dr.json();if(er.ok)epg=await er.json();renderCats();render()}catch(e){$('status').textContent='Load failed';msg(e.message)}})();
</script></body></html>
